[package]
name = "lucide-iced"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Compile-time tree-shaken Lucide icons for the Iced GUI framework"
license = "ISC"
repository = "https://github.com/K0oRui/lucide-iced"
keywords = ["iced", "gui", "icons", "lucide", "svg"]
categories = ["gui", "graphics", "rendering::graphics-api"]
readme = "README.md"
build = "build.rs"
include = [
    "src/**",
    "build.rs",
    "icons/**",
    "fonts/**",
    "LICENSE",
    "README.md",
]

[dependencies]
iced = { version = "0.14", default-features = false, features = ["svg", "advanced", "thread-pool"] }

[features]
default = []
font = []
# Exposes the `build` module with `register_icons`, for use as a build-dependency.
build = []

[dev-dependencies]
iced = { version = "0.14", features = ["wgpu", "tiny-skia"] }

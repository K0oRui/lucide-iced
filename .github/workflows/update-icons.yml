name: Update Lucide Icons

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest Lucide release
        id: release
        run: |
          TAG=$(curl -s https://api.github.com/repos/lucide-icons/lucide/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Fetched Lucide tag: $TAG"

      - name: Download icon SVGs
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          URL="https://github.com/lucide-icons/lucide/archive/refs/tags/${TAG}.tar.gz"
          curl -sL "$URL" -o lucide.tar.gz
          tar -xzf lucide.tar.gz
          SRC="lucide-${TAG#v}/icons"
          mkdir -p icons
          rm -f icons/*.svg
          cp "$SRC"/*.svg icons/
          echo "Copied $(ls icons/*.svg | wc -l) SVGs"
          # Remove the extracted repo so only icons/ and fonts/ changes are committed
          rm -rf "lucide-${TAG#v}" lucide.tar.gz

      - name: Download Lucide font
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          mkdir -p fonts
          # The font ships inside a zip asset (e.g. lucide-font-1.38.0.zip),
          # not as a bare lucide.ttf. Download and extract it.
          curl -sL "https://github.com/lucide-icons/lucide/releases/download/${TAG}/lucide-font-${TAG}.zip" -o lucide-font.zip
          unzip -o lucide-font.zip -d lucide-font-extracted
          FONT=$(find lucide-font-extracted -name '*.ttf' | head -n 1)
          if [ -z "$FONT" ]; then
            echo "::error::No .ttf found in lucide-font-${TAG}.zip"
            exit 1
          fi
          cp "$FONT" fonts/lucide.ttf
          rm -rf lucide-font.zip lucide-font-extracted
          echo "Font size: $(stat -c%s fonts/lucide.ttf) bytes"

      - name: Validate Lucide font
        run: |
          # A real TTF starts with the 0x00010000 signature and is far larger
          # than an HTML error page. Fail loudly if the download was garbage.
          if [ "$(head -c 4 fonts/lucide.ttf | xxd -p)" != "00010000" ]; then
            echo "::error::fonts/lucide.ttf is not a valid TTF (bad signature)"
            exit 1
          fi
          SIZE=$(stat -c%s fonts/lucide.ttf)
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::fonts/lucide.ttf is suspiciously small ($SIZE bytes)"
            exit 1
          fi
          echo "Font validated: $SIZE bytes"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update Lucide icons to ${{ steps.release.outputs.tag }}"
          branch: "auto-update/lucide-${{ steps.release.outputs.tag }}"
          delete-branch: true
          title: "Update Lucide icons to ${{ steps.release.outputs.tag }}"
          body: |
            Automated update of vendored Lucide icons and font.

            **Lucide tag:** `${{ steps.release.outputs.tag }}`

            **Icons updated:** $(ls icons/*.svg | wc -l) SVGs synced.

            Please review before merging.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number != ''
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report
        run: |
          if [ "${{ steps.cpr.outputs.pull-request-number }}" != "" ]; then
            echo "PR opened: #${{ steps.cpr.outputs.pull-request-number }}"
            echo "Auto-merge enabled — will merge once checks pass."
          else
            echo "No changes detected; no PR opened."
          fi
